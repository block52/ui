<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <base href="/" />
        <link rel="icon" href="/b52favicon.svg" />
        <link rel="apple-touch-icon" href="/b52favicon.svg" />
        <link rel="mask-icon" href="/b52favicon.svg" color="#000000" />
        <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="%VITE_APP_DESCRIPTION%" />
        <!-- Facebook Meta Tags -->
        <meta property="og:url" content="%VITE_APP_URL%" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="%VITE_APP_TITLE%" />
        <meta property="og:description" content="%VITE_APP_DESCRIPTION%" />
        <meta property="og:image" content="%VITE_APP_IMAGE%" />
        <!-- Twitter Meta Tags -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:domain" content="%VITE_APP_DOMAIN%" />
        <meta name="twitter:title" content="%VITE_APP_TITLE%" />
        <meta name="twitter:description" content="%VITE_APP_DESCRIPTION%" />
        <meta name="twitter:image" content="%VITE_APP_IMAGE%" />

        <link rel="manifest" href="/manifest.json" />
        <title>%VITE_APP_TITLE%</title>
        <script>
            // Apply the saved theme before first paint so there is no dark/light flash.
            // Keep in sync with utils/theme.ts (key, dark-only routes, default).
            (function () {
                var theme = "dark";
                try {
                    var saved = localStorage.getItem("b52-theme");
                    if (saved === "light" || saved === "dark") theme = saved;
                } catch (e) {}
                var p = location.pathname;
                if (p.indexOf("/table/") === 0 && p !== "/table/admin") theme = "dark";
                document.documentElement.dataset.theme = theme;
                document.documentElement.style.colorScheme = theme;
            })();
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="app"></div>
        <script>
            // Browser polyfills for Node.js modules
            if (typeof global === "undefined") {
                var global = globalThis;
            }
            if (typeof process === "undefined") {
                var process = { env: {}, browser: true };
            }
        </script>
        <script type="module" src="/src/index.tsx"></script>
    </body>
</html>
